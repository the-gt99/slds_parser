<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLDS · Наблюдаемость</title><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/admin-list.js"></script></head>
<body>
<div id="login-view" class="login-shell" hidden><form id="login-form" class="login-card"><div class="brand-mark">S</div><div><p class="eyebrow">SLDS Parser</p><h1>Наблюдаемость</h1><p class="muted">Войдите в административный интерфейс.</p></div><label class="field"><span>Пользователь</span><input id="login-username" required autocomplete="username"></label><label class="field"><span>Пароль</span><input id="login-password" type="password" required autocomplete="current-password"></label><p id="login-error" class="form-error" hidden></p><button class="button primary wide" type="submit">Войти</button></form></div>
<div id="app-view" class="app-shell" hidden>
<header class="topbar"><div class="brand-line"><a class="brand-mark small brand-link" href="/products">S</a><div><p class="eyebrow">SLDS Parser</p><h1 id="page-title">Товары</h1></div></div><div class="topbar-actions"><span id="operator-name" class="operator"></span><button id="logout-button" class="button quiet">Выйти</button></div></header>
<nav class="admin-nav" aria-label="Основные разделы"><a href="/classifier">Классификатор</a><a href="/classifier-config">Настройки классификации</a><a href="/products">Товары</a><a href="/operations">Операции</a><a href="/runtime">Парсер</a><a href="/wordpress-snapshots">Снимки WordPress</a><a href="/proxies">Прокси</a></nav>
<main class="admin-page">
<form id="filters" class="admin-filters"><label class="field"><span>Поиск</span><input id="search" placeholder="ID, external ID или название"></label><label id="source-filter" class="field"><span>Источник</span><select id="source"><option value="">Все</option></select></label><label id="stage-filter" class="field"><span>Стадия</span><select id="stage"><option value="">Все</option><option value="discovered">Обнаружен</option><option value="collected">Собран</option><option value="classification_pending">Ожидает классификации</option><option value="classified">Классифицирован</option></select></label><label id="classification-filter" class="field"><span>Классификация</span><select id="classification"><option value="">Любая</option><option value="not_processed">Не запускалась</option><option value="pending">Не завершена</option><option value="complete">Завершена</option></select></label><label id="target-filter" class="field"><span>Target</span><select id="target-status"><option value="">Любой</option><option value="not_exported">Не выгружен</option><option value="pending">В очереди</option><option value="observed">Найден в WordPress</option><option value="synced">Синхронизирован</option><option value="failed">Ошибка</option></select></label><button class="button primary" type="submit">Применить</button></form>
<div id="loading" class="product-message">Загрузка…</div><div id="error" class="product-message error" hidden></div><div id="empty" class="product-message" hidden>Записей не найдено.</div>
<section id="table-section" class="section admin-table-section" hidden><div class="table-wrap"><table class="admin-table"><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div class="pagination"><button id="prev" class="button quiet">← Назад</button><span id="page-info"></span><button id="next" class="button quiet">Вперёд →</button></div></section>
</main></div></body></html>
