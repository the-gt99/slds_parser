server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name parser.slamdunk.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/parser-acme;
    }

    location / {
        return 301 https://parser.slamdunk.shop$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name parser.slamdunk.shop;

    ssl_certificate /etc/letsencrypt/live/parser.slamdunk.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parser.slamdunk.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;

    location /images/ {
        alias /srv/slds-parser/state/images/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
        error_page 404 = @cdn_image;
    }

    location @cdn_image {
        rewrite "^/images/([a-zA-Z0-9_-]+/item_[a-zA-Z0-9_-]+/[0-9]+(?:-main)?(?:\.[a-f0-9]{64})?\.webp)$" https://cdn.slamdunk.shop/parser/$1 redirect;
        return 404;
    }

    location / {
        if (-f /etc/nginx/parser-maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
