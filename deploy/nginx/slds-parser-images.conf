map $http_x_forwarded_proto $slds_redirect_https {
    default 1;
    https 0;
}

map $uri $slds_cdn_image_redirect {
    default "";
    "~^/images/(?<slds_image_relative>[a-zA-Z0-9_-]+/item_[a-zA-Z0-9_-]+/[0-9]+(?:-main)?(?:\.[a-f0-9]{64})?\.webp)$" https://cdn.slamdunk.shop/parser/$slds_image_relative;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 9a9f7857687f.vps.myjino.ru;

    if ($slds_redirect_https) {
        return 301 https://$host$request_uri;
    }

    location /images/ {
        alias /srv/slds-parser/state/images/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
        error_page 404 = @slds_cdn_image;
    }

    location @slds_cdn_image {
        if ($slds_cdn_image_redirect = "") { return 404; }
        return 302 $slds_cdn_image_redirect;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
